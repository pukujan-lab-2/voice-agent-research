name: CI

# One required check, "gates", runs the same steps as `npm run check` plus Python lint and the ACS train check.
# Runner: GitHub-hosted (docs/decisions/0010). The repository is public, so hosted minutes are free. Never run this on a
# self-hosted runner while the repository is public: that would run code from anyone's pull request on our machine.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: [self-hosted, org-pool]
    timeout-minutes: 15
    # A fresh Redis for the recording queue's tests (demo/live-site/recording-queue.ts), the version the VPS runs
    # (deploy/docker-compose.vps.yml). It is thrown away with the job.
    services:
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      RECORDING_QUEUE_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            copilot-engine/package-lock.json
            demo/live-site/package-lock.json
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: copilot-engine
      - run: npm ci --ignore-scripts
        working-directory: demo/live-site
      - name: Lint (Biome)
        run: npm run lint
      - name: Typecheck (TypeScript, strict)
        run: npm run typecheck
      - name: Orphans (Knip)
        run: npm run orphans
      - name: Engine tests
        run: npm test
      - name: Engine scenarios (rule model, offline)
        run: npm --prefix copilot-engine run scenarios
      - name: Replay the guarded cases (recorded real turns; fails when a fixed answer comes back)
        run: npm run replay
      - uses: astral-sh/setup-uv@v6
      - name: Ingestion tests (Python)
        run: npm run test:py
      - name: Voice agent stall watchdog tests (Python)
        run: npm run test:speech
      - name: Speech gateway routing tests (Python)
        run: npm run test:gateway
      - name: Lane manifests and the check that one lane never imports another (Python)
        run: npm run test:agent
      # The TLA+ model of the recording queue (formal/README.md). The jar is the release server-management's CI uses.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Recording queue model (TLA+)
        run: npm run test:formal
      - name: Issue-log record tool checks its priority handling
        run: python3 .github/scripts/oio_record.py --self-test
      - name: Lint Python (Ruff)
        run: uvx ruff@0.14.0 check .

  stack-train:
    uses: Pukujan/agent-stack-train/.github/workflows/check-adopter.yml@main
    with:
      manifest: stack-manifest.json
      runs_on: '["ubuntu-latest"]'
