[project]
name = "site-ingest"
version = "0.1.0"
description = "Load a business's own site and documents into its own Octo prefix: crawl, clean, split, load, re-crawl."
requires-python = ">=3.10"
dependencies = [
  "trafilatura>=2.0",   # HTML to clean Markdown, metadata, sitemaps
  "py3langid>=0.3",     # language of a page with no lang attribute
  "httpx>=0.27",        # conditional GETs (ETag, Last-Modified)
]

[project.optional-dependencies]
pdf = ["docling>=2.0"]   # PDF layout, tables and its hybrid chunker
dev = ["pytest>=8"]

[project.scripts]
site-ingest = "site_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_ingest"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
